# Manual APK build — trigger via Actions → "Build APK" → Run workflow.
# Also fires automatically on every push to master so the latest build is
# always available as a downloadable artifact.
#
# Required GitHub Secrets (same as release.yml):
#   SIGNING_KEYSTORE_BASE64   base64-encoded upload keystore
#   SIGNING_KEYSTORE_PASSWORD keystore password
#   SIGNING_KEY_ALIAS         key alias
#   SIGNING_KEY_PASSWORD      key password
#   CURRENCY_API_KEY          currency exchange API key
#   SUPABASE_URL              (optional) Supabase project URL
#   SUPABASE_ANON_KEY         (optional) Supabase anon key
#
# If signing secrets are absent the workflow falls back to a debug APK.

name: Build APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.2.3). Defaults to "dev".'
        required: false
        default: 'dev'
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version name
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version_name }}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        if: steps.keystore.outputs.available == 'true'
        env:
          VERSION_NAME: ${{ steps.ver.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CURRENCY_API_KEY: ${{ secrets.CURRENCY_API_KEY }}
        run: ./gradlew :app:assembleRelease --no-configuration-cache

      - name: Build debug APK (fallback — no signing secrets)
        if: steps.keystore.outputs.available == 'false'
        env:
          VERSION_NAME: ${{ steps.ver.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
          CURRENCY_API_KEY: ${{ secrets.CURRENCY_API_KEY }}
        run: ./gradlew :app:assembleDebug --no-configuration-cache

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | grep -v unsigned | head -n1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $APK)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nomad-${{ steps.ver.outputs.version }}-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version_name != 'dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ steps.ver.outputs.version }}
          name: APK ${{ steps.ver.outputs.version }}
          draft: false
          prerelease: false
          files: ${{ steps.apk.outputs.path }}
